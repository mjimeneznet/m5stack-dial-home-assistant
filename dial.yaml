packages:
  defaults:    !include main/defaults.yaml
  hardware:    !include main/hardware.yaml
  entities:      !include main/entities.yaml
  entities_demo: !include main/entities_demo.yaml
  load_page:   !include pages/load.yaml
  clock_page:  !include pages/main.yaml
  menu_page:   !include pages/menu.yaml
  light_page:  !include pages/light.yaml
  light_selector_page: !include pages/light_selector.yaml
  air_page:    !include pages/air.yaml
  climate_selector_page: !include pages/climate_selector.yaml
  music_page:  !include pages/music.yaml
  timer_page:  !include pages/timer.yaml
  idle:        !include main/idle.yaml

external_components:
  - source: github://mjimeneznet/m5stack-dial-home-assistant@main
    components: [dial_lights, dial_carousel, dial_climates]
    refresh: 0s

# This package ships no lights. Declare each light as one `main/dial_light.yaml` entry in
# your own packages block; that template declares the `dial_lights` entry plus the Home
# Assistant sensors the Lights page reads for live state, so the package stays generic.
# See the Lights section of docs/configuration.md.

substitutions:
  timezone: Europe/Madrid
  light_entity: light.mesa
  # Remote packages resolve relative asset paths against the *consumer* config
  # directory, so images and fonts are downloaded over HTTPS instead. Override
  # this to match the ref you pin in your local `packages:` block.
  asset_base_url: https://raw.githubusercontent.com/mjimeneznet/m5stack-dial-home-assistant/main
  # Remote packages cannot resolve !secret themselves. Set these from the
  # consumer configuration (usually with !secret values in that local file).
  device_name: m5stack-dialv1
  device_friendly_name: M5Stack Dial
  wifi_ssid: YOUR_WIFI_SSID
  wifi_password: YOUR_WIFI_PASSWORD
  ap_ssid: Dial Fallback Hotspot
  ap_password: change-me-fallback-password
  # Public dummy key for validation only. Always override before flashing.
  api_encryption_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  ota_password: change-me-ota-password
  screen_dim_timeout: 45s
  screen_return_timeout: 5min
  screen_off_timeout: 30min
  screen_dim_brightness: "20%"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  on_boot:
    - priority: 800
      then:
        - switch.turn_on: power_hold
    - priority: -100
      then:
        - pcf8563.read_time:
        - light.turn_on:
            id: display_backlight
            brightness: 100%
        - script.execute: update_loading_page

esp32:
  board: m5stack-stamps3
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BROWNOUT_DET: "n"

logger:
  level: INFO
  # A light that is off, or an attribute a light does not expose, reports None and the
  # Home Assistant sensor platform logs a warning for each of those reads (it publishes
  # NAN, which the pages already ignore). Keep that tag quiet so real warnings stand out.
  logs:
    homeassistant.sensor: ERROR

api:
  encryption:
    key: ${api_encryption_key}
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: ha_connected
              value: 'false'

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

captive_portal:

globals:
  - id: ha_connected
    type: bool
    initial_value: 'false'

image:
  - platform: file
    file: ${asset_base_url}/images/logo.png
    id: logo_img
    type: RGB565
    transparency: alpha_channel
    resize: 72x72
  - platform: file
    file: ${asset_base_url}/images/scene.png
    id: img_scene
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${asset_base_url}/images/bulb.png
    id: img_light
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${asset_base_url}/images/ac.png
    id: img_ac
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${asset_base_url}/images/music.png
    id: img_music
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${asset_base_url}/images/palette.png
    id: img_palette
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${asset_base_url}/images/brightness.png
    id: img_brightness
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - platform: file
    file: ${asset_base_url}/images/light.png
    id: img_dengguang
    type: RGB565
    transparency: alpha_channel
    resize: 24x24

color:
  - id: col_bg
    hex: "050812"
  - id: col_text_pri
    hex: "EEF2FF"
  - id: col_text_sec
    hex: "6B7FCC"

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  encoders:
    - sensor: encoder
      enter_button: front_button
  buffer_size: "12%"
  color_depth: 16
  bg_color: col_bg
  default_font: font_lbl
